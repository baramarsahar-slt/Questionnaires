  help_en: "<p>For each sentence, mark a point on the scale — how true it is for me: from \"Always\" to \"Never\".</p><p style='margin-top:.6rem;font-size:.95rem;color:var(--muted)'>You can also check \"Others comment on this about me\". You can take your time, and if something is hard — you can ask an adult for help.</p>",

    {id:"d1",title:"להתחיל ולדבר עם אחרים",title_en:"Starting and Talking with Others",sub:"איך אני נכנס/ת לשיחה.",sub_en:"How I get into a conversation.",items:[
      {id:"d1q1",pole:"high",t:"קשה לי להתחיל לדבר עם מישהו ראשון.",t_en:"It's hard for me to be the first to start talking to someone."},

      {id:"d1q4",pole:"high",t:"קשה לי להצטרף לקבוצת ילדים שכבר מדברים.",t_en:"It's hard for me to join a group of kids who are already talking."}
    ]},
    {id:"d2",title:"הגוף שלי כשאני מדבר/ת",title_en:"My Body When I Talk",sub:"מה הגוף והקול שלי עושים.",sub_en:"What my body and voice do.",items:[

      {id:"d2q4",pole:"high",t:"כשאני מספר/ת סיפור, לפעמים יש בו יותר מדי פרטים או מעט מדי.",t_en:"When I tell a story, sometimes it has too many details or too few."}
